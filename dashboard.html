<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAHAYAK 24/7 — Rescue Dashboard</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #0f172a; color: white; height: 100vh; display: flex; flex-direction: column; }
    header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #dc2626; }
    header h1 { margin: 0; font-size: 20px; color: #f87171; }
    header .status { font-size: 13px; color: #22c55e; }
    .layout { flex: 1; display: flex; overflow: hidden; }
    .sidebar { width: 360px; background: #1e293b; overflow-y: auto; border-right: 1px solid #334155; }
    .sidebar h2 { font-size: 13px; padding: 12px 16px; margin: 0; background: #0f172a; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
    .sos-item { padding: 14px 16px; border-bottom: 1px solid #334155; cursor: pointer; transition: background 0.15s; border-left: 4px solid transparent; }
    .sos-item:hover { background: #334155; }
    .sos-item.critical { border-left-color: #dc2626; }
    .sos-item.medium   { border-left-color: #f59e0b; }
    .sos-item.low      { border-left-color: #22c55e; }
    .sos-item .time { font-size: 11px; color: #94a3b8; }
    .sos-item .coords { font-size: 13px; color: #e2e8f0; margin-top: 4px; }
    .sos-item .row { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
    .badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 10px; text-transform: uppercase; color: white; }
    .badge.critical { background: #dc2626; }
    .badge.medium   { background: #f59e0b; color: #1e293b; }
    .badge.low      { background: #22c55e; }
    .score { font-size: 11px; color: #94a3b8; }
    #map { flex: 1; height: 100%; }
    .empty { padding: 20px; text-align: center; color: #64748b; font-size: 13px; }
    .actions { display: flex; gap: 6px; margin-top: 8px; }
    .actions button { flex: 1; font-size: 11px; padding: 6px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-dispatch { background: #f59e0b; color: #1e293b; }
    .btn-resolve  { background: #22c55e; color: white; }
    .actions button:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <h1>🛰️ SAHAYAK 24/7 — Rescue Dashboard</h1>
    <div class="status" id="status">Connecting...</div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <h2>Incoming SOS (Priority Sorted)</h2>
      <div id="sosList"><div class="empty">Loading...</div></div>
    </aside>
    <div id="map"></div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot, doc, updateDoc } 
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC2pufseWikuPfS25zP68DTEhFDjLM4aQ4",
      authDomain: "resqtech-sahayak.firebaseapp.com",
      projectId: "resqtech-sahayak",
      storageBucket: "resqtech-sahayak.firebasestorage.app",
      messagingSenderId: "213946051441",
      appId: "1:213946051441:web:f8532dc039ed007ae724d0",
      measurementId: "G-GGDB34995M"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // ---------- MAP ----------
    const map = L.map("map").setView([22.9734, 78.6569], 5);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { attribution: "© OpenStreetMap" }).addTo(map);

    // ---------- OVERPASS: MULTIPLE ENDPOINTS WITH FALLBACK ----------
    const OVERPASS_ENDPOINTS = [
      "https://overpass-api.de/api/interpreter",
      "https://overpass.kumi.systems/api/interpreter",
      "https://overpass.private.coffee/api/interpreter"
    ];

    async function findNearbyServices(lat, lng) {
      const query = `
        [out:json][timeout:25];
        (
          nwr["amenity"="fire_station"](around:15000,${lat},${lng});
          nwr["amenity"="police"](around:15000,${lat},${lng});
          nwr["amenity"="hospital"](around:15000,${lat},${lng});
        );
        out center;
      `;
      const encoded = encodeURIComponent(query);

      for (const endpoint of OVERPASS_ENDPOINTS) {
        try {
          console.log(`🌐 Trying Overpass: ${endpoint}`);
          const res = await fetch(`${endpoint}?data=${encoded}`);
          if (!res.ok) {
            console.warn(`   → HTTP ${res.status}`);
            continue;
          }
          const data = await res.json();
          const count = data.elements?.length || 0;
          console.log(`✅ Found ${count} services from ${endpoint}`);
          if (count > 0) return data.elements;
        } catch (err) {
          console.warn(`   → Failed: ${err.message}`);
        }
      }
      console.warn("❌ All Overpass endpoints failed or returned nothing");
      return [];
    }

    function renderServices(elements) {
      elements.forEach(el => {
        const lat = el.lat || el.center?.lat;
        const lng = el.lon || el.center?.lon;
        if (!lat || !lng) return;
        const amenity = el.tags?.amenity;
        let emoji = "🏢", color = "#64748b", label = "Facility";
        if (amenity === "fire_station") { emoji = "🚒"; color = "#dc2626"; label = "Fire Station"; }
        else if (amenity === "police")  { emoji = "🚓"; color = "#2563eb"; label = "Police"; }
        else if (amenity === "hospital"){ emoji = "🏥"; color = "#16a34a"; label = "Hospital"; }

        const icon = L.divIcon({
          className: "",
          html: `<div style="font-size:18px; filter: drop-shadow(0 0 4px ${color});">${emoji}</div>`,
          iconSize: [22, 22],
          iconAnchor: [11, 11]
        });

        L.marker([lat, lng], { icon })
          .addTo(map)
          .bindPopup(`<b>${el.tags?.name || label}</b><br/>Type: ${label}`);
      });
    }

    // ---------- DISPATCH SYSTEM ----------
    const activeTeams = [];
    const dispatchedSos = new Set();

    function distanceKm(a, b) {
      const R = 6371;
      const dLat = (b[0] - a[0]) * Math.PI / 180;
      const dLng = (b[1] - a[1]) * Math.PI / 180;
      const x = Math.sin(dLat/2)**2 +
                Math.cos(a[0]*Math.PI/180) * Math.cos(b[0]*Math.PI/180) *
                Math.sin(dLng/2)**2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function findNearest(services, type, sosLat, sosLng) {
      let nearest = null, nearestDist = Infinity;
      services.forEach(el => {
        if (el.tags?.amenity !== type) return;
        const lat = el.lat || el.center?.lat;
        const lng = el.lon || el.center?.lon;
        if (!lat || !lng) return;
        const d = distanceKm([lat, lng], [sosLat, sosLng]);
        if (d < nearestDist) {
          nearestDist = d;
          nearest = { lat, lng, name: el.tags?.name || `Nearest ${type}` };
        }
      });
      return nearest;
    }

    // Fallback: virtual responder ~15km away
    function virtualResponder(sosLat, sosLng, label) {
      const angle = Math.random() * Math.PI * 2;
      const distKm = 15;
      const dLat = (distKm / 111) * Math.cos(angle);
      const dLng = (distKm / (111 * Math.cos(sosLat * Math.PI / 180))) * Math.sin(angle);
      return {
        lat: sosLat + dLat,
        lng: sosLng + dLng,
        name: label + " (approx. unit)"
      };
    }

    // Get OSRM route geometry
    async function getRouteGeometry(startLat, startLng, endLat, endLng) {
      const url = `https://router.project-osrm.org/route/v1/driving/${startLng},${startLat};${endLng},${endLat}?overview=full&geometries=geojson`;
      try {
        const res = await fetch(url);
        const data = await res.json();
        if (data.code !== "Ok" || !data.routes?.[0]) return null;
        return data.routes[0].geometry.coordinates; // [lng, lat] pairs
      } catch (err) {
        console.warn("OSRM failed:", err.message);
        return null;
      }
    }

    async function dispatchTeam(sosLat, sosLng, sosId, disasterType) {
      if (dispatchedSos.has(sosId)) return;
      dispatchedSos.add(sosId);

      // 1. Find services
      const services = await findNearbyServices(sosLat, sosLng);
      renderServices(services);

      // 2. Get nearest of each type (with virtual fallback)
      let nearestHospital = findNearest(services, "hospital", sosLat, sosLng);
      let nearestPolice   = findNearest(services, "police", sosLat, sosLng);
      let nearestFire     = findNearest(services, "fire_station", sosLat, sosLng);

      if (!nearestHospital) nearestHospital = virtualResponder(sosLat, sosLng, "🚑 Ambulance");
      if (!nearestPolice)   nearestPolice   = virtualResponder(sosLat, sosLng, "🚓 Police");
      if (!nearestFire && ["fire", "building_collapse", "earthquake"].includes((disasterType || "").toLowerCase())) {
        nearestFire = virtualResponder(sosLat, sosLng, "🚒 Fire");
      }

      // 3. Build responders list
      const responders = [
        { emoji: "🚑", name: nearestHospital.name, lat: nearestHospital.lat, lng: nearestHospital.lng, color: "#16a34a" },
        { emoji: "🚓", name: nearestPolice.name,   lat: nearestPolice.lat,   lng: nearestPolice.lng,   color: "#2563eb" }
      ];
      if (nearestFire) {
        responders.push({ emoji: "🚒", name: nearestFire.name, lat: nearestFire.lat, lng: nearestFire.lng, color: "#dc2626" });
      }

      // 4. For each responder: draw route line + place marker + animate
      for (const r of responders) {
        // Draw route line
        const coords = await getRouteGeometry(r.lat, r.lng, sosLat, sosLng);
        let line;
        if (coords && coords.length > 1) {
          line = L.polyline(coords.map(([lng, lat]) => [lat, lng]), {
            color: r.color, weight: 5, opacity: 0.8
          }).addTo(map);
        } else {
          // Fallback: dashed straight line
          line = L.polyline([[r.lat, r.lng], [sosLat, sosLng]], {
            color: r.color, weight: 3, opacity: 0.5, dashArray: "6 6"
          }).addTo(map);
        }

        // Marker
        const icon = L.divIcon({
          className: "",
          html: `<div style="font-size:22px; filter: drop-shadow(0 0 6px ${r.color});">${r.emoji}</div>`,
          iconSize: [24, 24],
          iconAnchor: [12, 12]
        });
        const marker = L.marker([r.lat, r.lng], { icon }).addTo(map);
        marker.bindPopup(`${r.emoji} Responding<br/>From: ${r.name}`);

        activeTeams.push({
          marker, line, coords: coords || [],
          startPos: [r.lat, r.lng],
          endPos: [sosLat, sosLng],
          progress: 0, sosId, name: r.name, emoji: r.emoji, color: r.color
        });
      }
    }

    // Animate all vehicles
    setInterval(() => {
      activeTeams.forEach(t => {
        if (t.progress >= 1) return;
        t.progress = Math.min(1, t.progress + 0.012);

        if (t.coords && t.coords.length > 1) {
          const idx = Math.floor(t.progress * (t.coords.length - 1));
          const [lng, lat] = t.coords[idx];
          t.marker.setLatLng([lat, lng]);
        } else {
          const lat = t.startPos[0] + (t.endPos[0] - t.startPos[0]) * t.progress;
          const lng = t.startPos[1] + (t.endPos[1] - t.startPos[1]) * t.progress;
          t.marker.setLatLng([lat, lng]);
        }

        if (t.progress >= 1) {
          t.marker.bindPopup(`✅ On scene: ${t.emoji} ${t.name}`).openPopup();
        }
      });
    }, 500);

    // ---------- PRIORITY SCORING ----------
    function severityScore(type) {
      const m = { fire: 5, earthquake: 5, building_collapse: 5, flood: 4, landslide: 4, other: 2 };
      return m[(type || "other").toLowerCase()] || 2;
    }
    function timeScore(createdAt) {
      if (!createdAt?.toDate) return 0;
      const mins = (Date.now() - createdAt.toDate().getTime()) / 60000;
      if (mins >= 60) return 5;
      if (mins >= 30) return 4;
      if (mins >= 15) return 3;
      if (mins >= 5)  return 2;
      return 1;
    }
    function computePriority(data) {
      const sev = severityScore(data.disasterType);
      const age = timeScore(data.createdAt);
      const statusBoost = data.status === "pending" ? 3 : 0;
      return Math.min(100, (sev * 10) + (age * 5) + (statusBoost * 5));
    }
    function priorityClass(score) {
      if (score >= 70) return "critical";
      if (score >= 45) return "medium";
      return "low";
    }

    // ---------- SOUND ----------
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch (e) { console.warn("Beep failed", e); }
    }

    // ---------- FIRESTORE LISTENER ----------
    const statusDiv = document.getElementById("status");
    const sosList = document.getElementById("sosList");
    const markers = {};
    let knownIds = new Set();
    let firstLoad = true;

    function removeSosFromMap(sosId) {
      if (markers[sosId]) {
        map.removeLayer(markers[sosId]);
        delete markers[sosId];
      }
      if (markers[sosId + "_box"]) {
        map.removeLayer(markers[sosId + "_box"]);
        delete markers[sosId + "_box"];
      }
      for (let i = activeTeams.length - 1; i >= 0; i--) {
        if (activeTeams[i].sosId === sosId) {
          map.removeLayer(activeTeams[i].marker);
          if (activeTeams[i].line) map.removeLayer(activeTeams[i].line);
          activeTeams.splice(i, 1);
        }
      }
    }

    onSnapshot(collection(db, "sos_requests"), (snapshot) => {
      const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));

      docs.forEach(d => {
        if (!knownIds.has(d.id) && d.status === "pending") {
          if (!firstLoad) playBeep();
          dispatchTeam(d.latitude, d.longitude, d.id, d.disasterType);
        }
      });

      docs.forEach(d => {
        if (d.status === "resolved") removeSosFromMap(d.id);
      });

      const visibleDocs = docs.filter(d => d.status !== "resolved");
      visibleDocs.forEach(d => d._score = computePriority(d));
      visibleDocs.sort((a, b) => b._score - a._score);

      sosList.innerHTML = "";
      statusDiv.textContent = `🟢 Live • ${visibleDocs.length} active`;

      if (visibleDocs.length === 0) {
        sosList.innerHTML = '<div class="empty">No active SOS requests.</div>';
      }

      visibleDocs.forEach(d => {
        const lat = d.latitude, lng = d.longitude;
        const time = d.createdAt?.toDate?.().toLocaleString() || "just now";
        const cls = priorityClass(d._score);

        const item = document.createElement("div");
        item.className = `sos-item ${cls}`;
        item.innerHTML = `
          <div class="time">${time}</div>
          <div class="coords">📍 ${lat.toFixed(4)}, ${lng.toFixed(4)}</div>
          <div class="row">
            <span class="badge ${cls}">${cls}</span>
            <span class="score">Score: ${d._score} • ${d.status || "pending"}</span>
          </div>
          <div class="actions">
            <button class="btn-dispatch" ${d.status !== "pending" ? "disabled" : ""}>Dispatch</button>
            <button class="btn-resolve">Resolve</button>
          </div>
        `;
        item.addEventListener("click", (e) => {
          if (e.target.tagName === "BUTTON") return;
          map.setView([lat, lng], 15);
          if (markers[d.id]) markers[d.id].openPopup();
        });
        const [dispatchBtn, resolveBtn] = item.querySelectorAll("button");
        dispatchBtn.addEventListener("click", async () => {
          await updateDoc(doc(db, "sos_requests", d.id), { status: "dispatched" });
        });
        resolveBtn.addEventListener("click", async () => {
          await updateDoc(doc(db, "sos_requests", d.id), { status: "resolved" });
        });
        sosList.appendChild(item);

        const color = cls === "critical" ? "#dc2626" : cls === "medium" ? "#f59e0b" : "#22c55e";
        if (!markers[d.id]) {
          const marker = L.circleMarker([lat, lng], {
            radius: 10, color: color, fillColor: color, fillOpacity: 0.9, weight: 3
          }).addTo(map);
          marker.bindPopup(`
            <b>🚨 SOS Request</b><br/>
            ${time}<br/>
            ${lat.toFixed(4)}, ${lng.toFixed(4)}<br/>
            <b>Priority:</b> ${cls.toUpperCase()} (${d._score})<br/>
            <b>Status:</b> ${d.status || "pending"}<br/>
            <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank">Open in Google Maps</a>
          `);
          markers[d.id] = marker;

          const box = L.rectangle([
            [lat - 0.0045, lng - 0.0045],
            [lat + 0.0045, lng + 0.0045]
          ], {
            color: color, weight: 2,
            fill: true, fillColor: color, fillOpacity: 0.15,
            dashArray: "6 4"
          }).addTo(map);
          box.bindPopup("📦 1km × 1km affected zone");
          markers[d.id + "_box"] = box;
        } else {
          markers[d.id].setStyle({ color, fillColor: color });
          if (markers[d.id + "_box"]) {
            markers[d.id + "_box"].setStyle({ color, fillColor: color });
          }
        }
      });

      if (firstLoad && visibleDocs.length > 0) {
        const bounds = L.latLngBounds(visibleDocs.map(d => [d.latitude, d.longitude]));
        map.fitBounds(bounds, { padding: [60, 60], maxZoom: 12 });
      }

      knownIds = new Set(docs.map(d => d.id));
      firstLoad = false;
    }, (error) => {
      console.error(error);
      statusDiv.textContent = "🔴 Error: " + error.message;
    });
  </script>
</body>
</html>
